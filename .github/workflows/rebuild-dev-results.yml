name: Run retrieval evaluation

on:
  workflow_dispatch:
    inputs:
      split:
        description: "Choose the evaluation split"
        required: true
        type: choice
        options:
          - dev
          - test
        default: dev
  push:
    branches:
      - main
    paths:
      - "data/passages.csv"
      - "data/queries.csv"
      - "scripts/rebuild_results.py"
      - "requirements.txt"
      - ".github/workflows/rebuild-dev-results.yml"

permissions:
  contents: write

concurrency:
  group: curriculumrag-retrieval-evaluation
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVAL_SPLIT: ${{ github.event.inputs.split || 'dev' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Evaluate selected split
        run: python scripts/rebuild_results.py --split "$EVAL_SPLIT"

      - name: Commit refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Rebuild ${EVAL_SPLIT} retrieval results"
            git push
          fi
