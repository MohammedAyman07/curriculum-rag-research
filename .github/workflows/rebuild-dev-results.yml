name: Rebuild development retrieval results

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/passages.csv"
      - "data/queries.csv"
      - "scripts/rebuild_results.py"
      - "requirements.txt"
      - ".github/workflows/rebuild-dev-results.yml"

permissions:
  contents: write

concurrency:
  group: curriculumrag-dev-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild development-only results
        run: python scripts/rebuild_results.py

      - name: Commit refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/*.csv results/dev_run_metadata.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Rebuild development results using grouped split"
            git push
          fi
